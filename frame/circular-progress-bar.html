<head>
<style>


body {
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
	padding: 20px;
	
}

.block {
	position: relative;
	display: flex;
	align-items: center;
	justify-content: center;
	width: 180px;
	height: 180px;
	border-radius: 50%;
}

.box { /*hinh tron ben trong*/
	position: relative;
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	width: calc(100% - 50px);
	height: calc(100% - 50px);
	border-radius: 50%;
	background-color: #292929;
	box-shadow: 0 0 5px 3px #222121;//duong vien cua hinh tron ben trong
}

.box::before {
	position: absolute;
	content: '';
	width: calc(100% + 28px);
	height: calc(100% + 28px);
	border-radius: 50%;
	border: 1px solid #353535;
}

.box .number span {
	color: #e9e9e9; /*mau cua text ben trong*/
}

.box .number .num {
	font-size: 35px;
	font-weight: bold;
}

.box .number .sub {
	font-size: 20px;
}

.box .title {
	font-size: 15px;
	color: #9b9b9b;/*mau cua sub title*/
}

.dots {//hinh tron nho? o progress bar
	display: block;
	position: absolute;
	z-index: 2;
	width: 100%;
	height: 100%;
	border-radius: 50%;
	transition: 2s transform, 2s opacity ease;
}

.dots::after {
	position: absolute;
	content: '';
	width: 10px;
	height: 10px;
	top: 5px;
	left: 50%;
	border-radius: 50%;
	background-color: #ffffff;
	box-shadow: 0 0 5px 2px yellow;
	transform: translateX(-50%);
}

.svg {
	position: absolute;
	width: 100%;
	height: 100%;
	fill: none;
	transform: rotate(-90deg);
}

.circle {
	stroke: url(#gradientStyle);
	stroke-width: 4px;
	stroke-dasharray: 503;
	stroke-dashoffset: 503;
	animation-duration: 2s;
	animation-timing-function: linear;
	animation-fill-mode: forwards;
	transition: 2s stroke-dashoffset;
	
}

</style>
</head>
<body>
<div class="block">
		<div class="box">
			<p class="number">
				<span id="data-value" class="num">0</span>
				<span class="sub">%</span>
			</p>
			<p id="data-title" class="title">HTML</p>
		</div>
		<span class="dots"></span>
		<svg class="svg">
			<defs>
				<linearGradient id="gradientStyle">
					<stop offset="0%" stop-color="#565656" />
					<stop offset="100%" stop-color="#b7b5b5" />
				</linearGradient>
			</defs>
			<circle class="circle" cx="90" cy="90" r="80" />
		</svg>
	</div>
	

</body>

<script>
const block = document.querySelectorAll('.block');
const gradient = document.querySelector('#gradientStyle');
let _stop=false;

function animate(color1,color2,value,title,_fc1){
block.forEach(item => {
	
	const stops = gradient.querySelectorAll('stop');
	stops[0].setAttribute('stop-color', color1);//gan' mau cho vong tron dang chay
	stops[1].setAttribute('stop-color', color2);
	
	document.getElementById("data-value").innerHTML=value;
	document.getElementById("data-title").innerHTML=title;

    let numElement = item.querySelector('.num');
    let num = parseInt(numElement.innerText);
    let count = 0;
    let time = 2000 / num;
    let circle = item.querySelector('.circle');
	
    setInterval(() => {
		if(_stop)return;
      if(count == num){
        clearInterval();
		_stop=true;
		_fc1();
      } else {
        count += 1;
        numElement.innerText = count;
      }
    }, time)
    circle.style.strokeDashoffset 
      = 503 - ( 503 * ( num / 100 ));
    let dots = item.querySelector('.dots');
    dots.style.transform = 
      `rotate(${360 * (num / 100)}deg)`;
    if(num == 100){
      dots.style.opacity = 0;
    }
  })
  
  
  
}

window.addEventListener('load', function(){
  //animate();
});
</script>
