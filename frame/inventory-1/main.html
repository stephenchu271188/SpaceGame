<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
  body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

html{
 background: url(img/bg.jpg) no-repeat center center fixed; 
  -webkit-background-size: cover;
  -moz-background-size: cover;
  -o-background-size: cover;
  background-size: cover;
}

.iframe-container {
  position: relative;
  width: 80%;
  height: 80%;
 
  border: 2px solid #3498db; /* Màu border và độ dày border */
  border-radius: 10px; /* Độ cong của border */
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Đổ bóng cho iframe-container */
  overflow: hidden; /* Ẩn phần overflow */
}

iframe {
  width: 100%;
  height: 100%;
}

#iframe-close-button {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 5px 10px;
  background-color: #f44336;
  color: white;
  border: none;
  cursor: pointer;
}

  </style>

</head>
<body>

<div class="iframe-container">
  <iframe src="index.html"></iframe>
  <button id="iframe-close-button">Close</button>
</div>


</body>
</html>

<script>
const closeButton = document.getElementById('iframe-close-button');
const iframe = document.querySelector('iframe');
const iframeContainer = document.querySelector('.iframe-container');

closeButton.addEventListener('click', () => {
  iframeContainer.style.display = 'none';
});

</script>
