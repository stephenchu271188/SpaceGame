body,
html {
  margin: 0;

  width: 100%;
  overflow: hidden;
  position: relative;
  background: -webkit-radial-gradient(center, rgba(0, 0, 70, 1) 0%, #000 60%);
}

::after,
::before {
  content: " ";
  display: block;
}
::after,
::before,
.moon,
.sky,
.star,
.asteroid {
  position: absolute;
}
.moon {
  color: #ffd;
  background: radial-gradient(
    circle at -30% 50%,
    rgba(0, 0, 0, 0) 175px,
    currentColor 100%
  );
  z-index: 999;
  border-radius: 50%;
  height: 200px;
  width: 200px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 20px currentColor);
}
.sky {
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  animation: rotate 400s infinite linear;
}
.star {
  width: 3px;
  height: 3px;
  background-color: white;
  border-radius: 50%;
  animation: shine 800s infinite linear;
  &.scale1 {
    transform: scale(1);
  }
  &.scale2 {
    transform: scale(0.5);
  }
  &.scale3 {
    transform: scale(1.3);
  }
  &.animate1 {
    animation-duration: 0.5s;
  }
  &.animate2 {
    animation-duration: 1s;
  }
  &.animate3 {
    animation-duration: 1.5s;
  }
  &.animate4 {
    animation-duration: 2s;
  }
  &.opacity1 {
    opacity: 1;
  }
  &.opacity2 {
    opacity: 0.5;
  }
  &.opacity3 {
    opacity: 0.2;
  }
}
.asteroid {
  top: -200px;
  left: -200px;
  width: 200px;
  height: 200px;
  opacity: 0.8;
  animation-name: assteroid;
  animation-timing-function: linease-inear;
  animation-iteration-count: infinite;
  animation-duration: 7s;
  animation-delay: 2s;
  &:before {
    width: 10px;
    height: 10px;
    background: #fff;
    .border-radius(50%);
    -webkit-box-shadow: 0px 0px 7px 2px #fff;
    -moz-box-shadow: 0px 0px 7px 2px #fff;
    box-shadow: 0px 0px 7px 2px #fff;
    bottom: 0;
    right: 0;
  }
  &:after {
    width: 0;
    height: 0;
    border-left: 3px solid transparent;
    border-bottom: 200px solid #fff;
    border-right: 3px solid transparent;
    bottom: -22px;
    right: 75px;
    .rotate(-45deg);
  }
}

function openVolume(){
	let _t_volume=localStorage.getItem("spaceGameVolume");
	if(_t_volume===null)
		_t_volume=100;
	else
		_t_volume=parseInt(_t_volume);
	
	_volume_slider.value=_t_volume;
	document.getElementById('volume-container').style.visibility='visible';
 }
 function closeVolume(){
 document.getElementById("wall").style.visibility="hidden";
	document.getElementById('volume-container').style.visibility='hidden';
 }
