  <style>
	
.iframe-container {
  position: relative;
  width: 80%;
  height: 80%;
  left:10%;
  top:10%;
 
  border: 2px solid #3498db; /* Màu border và độ dày border */
  border-radius: 10px; /* Độ cong của border */
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Đổ bóng cho iframe-container */
  overflow: hidden; /* Ẩn phần overflow */
  
  display:none;
}

iframe {
  width: 100%;
  height: 100%;
}

#iframe-close-button {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 5px 10px;
  background-color: #f44336;
  color: white;
  border: none;
  cursor: pointer;
}



.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index:99999999999;
  min-width: 420px; 
  min-height: 45px;
  transform: translate(-50%, -50%);
  border: 1px solid transparent;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  z-index: 1000;
  width: 32vw;
  height: 18vw; /* 16:9 aspect ratio */
  overflow: hidden;
  border-width: 3px;
  border-image: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  border-image-slice: 1;
  border-image-source: unset;
  animation: borderGradient 5s linear infinite;
  resize: both;
}

@keyframes borderGradient {
  0% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
  25% {
    border-image-source: linear-gradient(45deg, #ff0000, #0000ff, #00ff00, #ff0000);
  }
  50% {
    border-image-source: linear-gradient(45deg, #0000ff, #ff0000, #00ff00, #0000ff);
  }
  75% {
    border-image-source: linear-gradient(45deg, #00ff00, #ff0000, #0000ff, #00ff00);
  }
  100% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
}

.modal-header {
  position: relative;
  padding: 10px;
  background-color: #1a1a1a;
  color: #00ff00;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  height: 25px;
}

.modal-header .close-icon{
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #ff0000;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}
.modal-header .minimize-icon {
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #eeff00;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}

.modal-header .close-icon:hover{
  background-color: #ff3300;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
}

.modal-header .minimize-icon:hover {
  background-color: #3cff00;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(21, 255, 0, 0.7);
}

.modal-content {
  padding: 20px;
  color: #fff;
  background-color: #1691E6;
  height: calc(100% - 85px);
}

.modal-hbutton {
  display: flex;
  justify-content: space-between;
  width: 60px;
  position: absolute;
  right: 15px;
}

.modal-htext {
  margin: 0 auto;
  user-select: none;
}




* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Tinos', serif;
}
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 260px;
  background: #000428; 
  background: -webkit-linear-gradient(to right, #004e92, #000428); 
  background: linear-gradient(to right, #004e92, #000428);
  z-index: 100;
  transition: all 0.5s ease;
}
.sidebar.close {
  width: 78px;
}
.sidebar .logo-details {
  height: 60px;
  width: 100%;
  display: flex;
  align-items: center;
}
.sidebar .logo-details i {
  font-size: 30px;
  color: #fff;
  height: 50px;
  min-width: 78px;
  text-align: center;
  line-height: 50px;
}
.sidebar .logo-details .logo_name {
  font-size: 22px;
  color: #fff;
  font-weight: 600;
  transition: 0.3s ease;
  transition-delay: 0.1s;
}
.sidebar.close .logo-details .logo_name {
  transition-delay: 0s;
  opacity: 0;
  pointer-events: none;
}
.sidebar .nav-links {
  height: 100%;
  padding: 0 0 150px 0;
  overflow: auto;
}
.sidebar.close .nav-links {
  overflow: visible;
}
.sidebar .nav-links::-webkit-scrollbar {
  display: none;
}
.sidebar .nav-links li {
  position: relative;
  list-style: none;
  transition: all 0.4s ease;
}
.sidebar .nav-links li:hover {
  background: #1d1b31;
}
.sidebar .nav-links li .icon-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar.close .nav-links li .icon-link {
  display: block;
}
.sidebar .nav-links li i {
  height: 50px;
  min-width: 78px;
  text-align: center;
  line-height: 50px;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.sidebar .nav-links li.showMenu i.arrow {
  transform: rotate(-180deg);
}
.sidebar.close .nav-links i.arrow {
  display: none;
}
.sidebar .nav-links li a {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.sidebar .nav-links li a .link_name {
  font-size: 18px;
  font-weight: 400;
  color: #fff;
  transition: all 0.4s ease;
}
.sidebar.close .nav-links li a .link_name {
  opacity: 0;
  pointer-events: none;
}
.sidebar .nav-links li .sub-menu {
  padding: 6px 6px 14px 80px;
  margin-top: -10px;
  background: #1d1b31;
  display: none;
}
.sidebar .nav-links li.showMenu .sub-menu {
  display: block;
}
.sidebar .nav-links li .sub-menu a {
  color: #fff;
  font-size: 15px;
  padding: 5px 0;
  white-space: nowrap;
  opacity: 0.6;
  transition: all 0.3s ease;
}
.sidebar .nav-links li .sub-menu a:hover {
  opacity: 1;
}
.sidebar.close .nav-links li .sub-menu {
  position: absolute;
  left: 100%;
  top: -10px;
  margin-top: 0;
  padding: 10px 20px;
  border-radius: 0 6px 6px 0;
  opacity: 0;
  display: block;
  pointer-events: none;
  transition: 0s;
}
.sidebar.close .nav-links li:hover .sub-menu {
  top: 0;
  opacity: 1;
  pointer-events: auto;
  transition: all 0.4s ease;
}
.sidebar .nav-links li .sub-menu .link_name {
  display: none;
}
.sidebar.close .nav-links li .sub-menu .link_name {
  font-size: 18px;
  opacity: 1;
  display: block;
}
.sidebar .nav-links li .sub-menu.blank {
  opacity: 1;
  pointer-events: auto;
  padding: 3px 20px 6px 16px;
  opacity: 0;
  pointer-events: none;
}
.sidebar .nav-links li:hover .sub-menu.blank {
  top: 50%;
  transform: translateY(-50%);
}
.sidebar .profile-details {
  position: fixed;
  bottom: 0;
  width: 260px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1d1b31;
  padding: 12px 0;
  transition: all 0.5s ease;
}
.sidebar.close .profile-details {
  background: none;
}
.sidebar.close .profile-details {
  width: 78px;
}
.sidebar .profile-details .profile-content {
  display: flex;
  align-items: center;
}
.sidebar .profile-details img {
  height: 52px;
  width: 52px;
  object-fit: cover;
  border-radius: 16px;
  margin: 0 14px 0 12px;
  background: #1d1b31;
  transition: all 0.5s ease;
}
.sidebar.close .profile-details img {
  padding: 10px;
}
.sidebar .profile-details .profile_name,
.sidebar .profile-details .job {
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  white-space: nowrap;
}
.sidebar.close .profile-details i,
.sidebar.close .profile-details .profile_name,
.sidebar.close .profile-details .job {
  display: none;
}
.sidebar .profile-details .job {
  font-size: 12px;
}
.home-section {
  position: relative;
  background: #e4e9f7;
  height: 100vh;
  left: 260px;
  width: calc(100% - 260px);
  transition: all 0.5s ease;
}
.sidebar.close ~ .home-section {
  left: 78px;
  width: calc(100% - 78px);
}
.home-section .home-content {
  height: 60px;
  display: flex;
  align-items: center;
}
.home-section .home-content .bx-menu,
.home-section .home-content .text {
  color: #11101d;
  font-size: 35px;
}
.home-section .home-content .bx-menu {
  margin: 0 15px;
  cursor: pointer;
}
.home-section .home-content .text {
  font-size: 26px;
  font-weight: 600;
}
@media (max-width: 420px) {
  .sidebar.close .nav-links li .sub-menu {
    display: none;
  }
}


  </style>

<script>
	let zIndexCounter = 1000;
function showModal(_width,_height,_title,_content) {
  const modal = document.getElementById('cyberModal1');
  const dragHeader = modal.querySelector('.modal-header');
  const closeIcon = dragHeader.querySelector('.close-icon');
  const minimizeIcon = dragHeader.querySelector('.minimize-icon');
  const content=modal.querySelector('.modal-content');
  let offsetX, offsetY;
  let isDragging = false;
  
  modal.style.width=_width;
  modal.style.height=_height;
  modal.style.zIndex="9999999999999";
  document.getElementById("modal-htext").innerHTML=_title;
  content.innerHTML=_content;
	
  closeIcon.addEventListener("click",()=>{
	modal.style.display = 'none';
  });
 

  let prevWidth = modal.style.width;
  let prevHeight = modal.style.height;
  minimizeIcon.addEventListener('click', toggleMinimize);

  function toggleMinimize() {
    if (modal.style.width === '240px' && modal.style.height === '45px') {
      modal.style.width = prevWidth;
      modal.style.height = prevHeight; 
    } else {
      prevWidth = modal.style.width;
      prevHeight = modal.style.height;
      modal.style.width = '240px';
      modal.style.height = '45px';
    }
  }
}
