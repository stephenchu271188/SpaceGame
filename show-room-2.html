	body{

.iframe-container {
  position: relative;
  width: 80%;
  height: 80%;
  left:10%;
  top:10%;
 
  border: 2px solid #3498db; /* Màu border và độ dày border */
  border-radius: 10px; /* Độ cong của border */
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Đổ bóng cho iframe-container */
  overflow: hidden; /* Ẩn phần overflow */
  
  display:none;
}

iframe {
  width: 100%;
  height: 100%;
}

#iframe-close-button {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 5px 10px;
  background-color: #f44336;
  color: white;
  border: none;
  cursor: pointer;
}



.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index:99999999999;
  min-width: 420px; 
  min-height: 45px;
  transform: translate(-50%, -50%);
  border: 1px solid transparent;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  z-index: 1000;
  width: 32vw;
  height: 18vw; /* 16:9 aspect ratio */
  overflow: hidden;
  border-width: 3px;
  border-image: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  border-image-slice: 1;
  border-image-source: unset;
  animation: borderGradient 5s linear infinite;
  resize: both;
}

@keyframes borderGradient {
  0% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
  25% {
    border-image-source: linear-gradient(45deg, #ff0000, #0000ff, #00ff00, #ff0000);
  }
  50% {
    border-image-source: linear-gradient(45deg, #0000ff, #ff0000, #00ff00, #0000ff);
  }
  75% {
    border-image-source: linear-gradient(45deg, #00ff00, #ff0000, #0000ff, #00ff00);
  }
  100% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
}

.modal-header {
  position: relative;
  padding: 10px;
  background-color: #1a1a1a;
  color: #00ff00;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  height: 25px;
}

.modal-header .close-icon{
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #ff0000;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}
.modal-header .minimize-icon {
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #eeff00;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}

.modal-header .close-icon:hover{
  background-color: #ff3300;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
}

.modal-header .minimize-icon:hover {
  background-color: #3cff00;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(21, 255, 0, 0.7);
}

.modal-content {
  padding: 20px;
  color: #fff;
  background-color: #1691E6;
  height: calc(100% - 85px);
}

.modal-hbutton {
  display: flex;
  justify-content: space-between;
  width: 60px;
  position: absolute;
  right: 15px;
}

.modal-htext {
  margin: 0 auto;
  user-select: none;
}


#rangeValue {
  position: relative;
  display: block;
  text-align: center;
  font-size: 6em;
  color: #999;
  font-weight: 400;
}
.range {
  width: 400px;
  height: 15px;
  -webkit-appearance: none;
  background: #111;
  outline: none;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: inset 0 0 5px rgba(0, 0, 0, 1);
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #00fd0a;
  cursor: pointer;
  border: 4px solid #333;
  box-shadow: -407px 0 0 400px #00fd0a;
}

  </style>
