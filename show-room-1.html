.arrow-text{
	background: linear-gradient(to bottom, black,white, black);
									-webkit-background-clip: text;
									-webkit-text-fill-color: transparent;
	font-size:12px;
	font-weight: bold;
	text-shadow:
        0 0 5px turquoise,
        0 0 10px turquoise,
        0 0 20px turquoise,
        0 0 40px turquoise,
        0 0 80px turquoise;
}
	
.box {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: linear-gradient(45deg, transparent, transparent 40%, yellow),
    linear-gradient(#262626, #141414);
  animation: rotate 1.5s linear infinite;
}

.box:before,
.box:after {
  content: " ";
  position: absolute;
  inset: 8px;
  background: linear-gradient(#161616, #262626);
  border-radius: inherit;
}

.box:before {
  background: linear-gradient(45deg, transparent, transparent 40%, yellow);
  filter: blur(32px);
}

@keyframes rotate {
  100% {
    transform: rotate(360deg);
    filter: hue-rotate(360deg);
  }
}


.pulsating-circle {
  position: absolute;
  left: 50%;
  top: 50%;
  
  width: 30px;
  height: 30px;
  
  &:before {
    content: '';
    position: relative;
    display: block;
    width: 300%;
    height: 300%;
    box-sizing: border-box;
    margin-left: -100%;
    margin-top: -100%;
    border-radius: 50px;
    background-color: #01a4e9;
    animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  }
  
  &:after {
    content: '';
    position: absolute;
    left: 0; 
    top: 0;
    display: block;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.0);;
    border-radius: 50px;
    box-shadow: 0 0 8px rgba(0,0,0,.3);
    animation: pulse-dot 1.25s cubic-bezier(0.455, 0.03, 0.515, 0.955) -.4s infinite;
  }
}

@keyframes pulse-ring {
  0% {
    transform: scale(.33);
  }
  80%, 100% {
    opacity: 0;
  }
}

@keyframes pulse-dot {
  0% {
    transform: scale(.8);
  }
  50% {
    transform: scale(1);
  }
  100% {
    transform: scale(.8);
  }
}
	
	
.ring-button {
  width: 110px;
  height: 45px;
  font-family: 'Nunito', sans-serif;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  font-weight: 700;
  color: #313133;
  background-color:rgba(251, 240, 62,1);
  
  //border: solid black 1px;
  border-radius: 10px;
  box-shadow: 12px 12px 24px rgba(79,209,197,.64);
  transition: all 0.3s ease-in-out 0s;
  cursor: pointer;
  outline: none;
  position: relative;
  padding: 10px;
  }

.ring-button::before {
content: '';
  border-radius: 10px;
  width: calc(110px + 5px);
  height: calc(45px + 5px);
  border: 3px solid #00FFCB;
  box-shadow: 0 0 60px rgba(0,255,203,.64);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: all .3s ease-in-out 0s;
}

.ring-button:hover, .ring-button:focus {
  color: #313133;
  transform: translateY(-6px);
}

.ring-button:hover::before, .ring-button:focus::before {
  opacity: 1;
}

.ring-button::after {
  content: '';
  width: 30px; height: 30px;
  border-radius: 100%;
  border: 6px solid #00FFCB;
  position: absolute;
  z-index: -1;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: ring-button 1.5s infinite;
}

.ring-button:hover::after, .ring-button:focus::after {
  animation: none;
  display: none;
}

@keyframes ring-button {
  0% {
    width: 30px;
    height: 30px;
    opacity: 1;
  }
  100% {
    width: 300px;
    height: 300px;
    opacity: 0;
  }
}

	
.iframe-container {
  position: absolute;
  width: 80%;
  height: 80%;
  left:10%;
  top:10%;
 
  border: 2px solid #3498db; /* Màu border và độ dày border */
  border-radius: 10px; /* Độ cong của border */
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Đổ bóng cho iframe-container */
  overflow: hidden; /* Ẩn phần overflow */
  
  display:none;
}

iframe {
  width: 100%;
  height: 100%;
}

#iframe-close-button {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 5px 10px;
  background-color: #f44336;
  color: white;
  border: none;
  cursor: pointer;
}



.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index:99999999999;
  min-width: 420px; 
  min-height: 45px;
  transform: translate(-50%, -50%);
  border: 1px solid transparent;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  z-index: 1000;
  width: 32vw;
  height: 18vw; /* 16:9 aspect ratio */
  overflow: hidden;
  border-width: 3px;
  border-image: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  border-image-slice: 1;
  border-image-source: unset;
  animation: borderGradient 5s linear infinite;
  resize: both;
}

@keyframes borderGradient {
  0% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
  25% {
    border-image-source: linear-gradient(45deg, #ff0000, #0000ff, #00ff00, #ff0000);
  }
  50% {
    border-image-source: linear-gradient(45deg, #0000ff, #ff0000, #00ff00, #0000ff);
  }
  75% {
    border-image-source: linear-gradient(45deg, #00ff00, #ff0000, #0000ff, #00ff00);
  }
  100% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
}

.modal-header {
  position: relative;
  padding: 10px;
  background-color: #1a1a1a;
  color: #00ff00;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  height: 25px;
}

.modal-header .close-icon{
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #ff0000;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}
.modal-header .minimize-icon {
  font-size: 20px;
  cursor: pointer;
  color: #1a1a1a;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #eeff00;
  border-radius: 5px;
  transition: all 0.3s ease-in-out;
}

.modal-header .close-icon:hover{
  background-color: #ff3300;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
}

.modal-header .minimize-icon:hover {
  background-color: #3cff00;
  transform: scale(1.2) rotate(45deg);
  box-shadow: 0 0 10px rgba(21, 255, 0, 0.7);
}

.modal-content {
  padding: 20px;
  color: #fff;
  background-color: #1691E6;
  height: calc(100% - 85px);
}

.modal-hbutton {
  display: flex;
  justify-content: space-between;
  width: 60px;
  position: absolute;
  right: 15px;
}

.modal-htext {
  margin: 0 auto;
  user-select: none;
}
