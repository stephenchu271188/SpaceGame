.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index:99999999999;
  min-width: 420px; 
  min-height: 45px;
  transform: translate(-50%, -50%);
  border: 1px solid transparent;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  z-index: 1000;
  width: 32vw;
  height: 18vw; /* 16:9 aspect ratio */
  overflow: hidden;
  border-width: 3px;
  border-image: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  border-image-slice: 1;
  border-image-source: unset;
  animation: borderGradient 5s linear infinite;
  resize: both;
}

@keyframes borderGradient {
  0% {
    border-image-source: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
  }
  25% {
    border-image-source: linear-gradient(45deg, #ff0000, #0000ff, #00ff00, #ff0000);
  }
  50% {
    border-image-source: linear-gradient(45deg, #0000ff, #ff0000, #00ff00, #0000ff);
  }
  75% {
    border-image-source: linear-gradient(45deg, #00ff00, #ff0000, #0000ff, #00ff00);
  }
  100% {

}

/*---------------------------------------------------*/

:root {
    --slider-border: 2px;
    --slider-height: 1.5rem;
    --slider-max-width: 100%;
    --slider-width: 20rem;
    --thumb-margin: 0.2rem;
    --thumb-size: calc(var(--slider-height) - (2 * var(--thumb-margin)));
}

/* slider container */
.range-slider {
    display: inline-block;
    max-width: var(--slider-max-width);
    position: relative;
	background-color: rgba(0, 0, 0, 0.0);
}

/* slider track */
.range-slider > .slider {
    border: var(--slider-border) solid;
    display: block;
    height: var(--slider-height);
    max-width: var(--slider-max-width);
    position: relative;
    width: var(--slider-width);
    z-index: 1;
	background-color: rgba(0, 0, 0, 0.0);
	
}
.range-slider > input[type="range"]:focus + .slider {
    outline: 2px solid;
    outline-offset: 2px;
	background-color: rgba(0, 0, 0, 0.0);
}

/* slider thumb */
.range-slider > .slider > .thumb {
    display: block;
    height: var(--slider-height);
    position: absolute;
    width: var(--slider-height);
}
.range-slider > .slider > .thumb::before {
    border: 2px solid;
    box-sizing: border-box;
    content: "";
    display: block;
    height: var(--thumb-size);
    margin: var(--thumb-margin);
    width: var(--thumb-size);
}

/* range input */
.range-slider > input[type="range"] {
    -webkit-appearance: none;
    height: var(--slider-height);
    margin: var(--slider-border);
    max-width: var(--slider-max-width);
    opacity: 0;
    position: absolute;
    width: var(--slider-width);
    z-index: 2;
	background-color: rgba(0, 0, 0, 0.0);
}
.range-slider > input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    display: block;
    height: var(--slider-height);
    width: var(--slider-height);
	background-color: rgba(0, 0, 0, 0.0);
}
.range-slider > input[type="range"]::-moz-range-thumb {
    display: block;
    height: var(--slider-height);
    width: var(--slider-height);
	background-color: rgba(0, 0, 0, 0.0);
}
      
.range-slider > .slider {
    background-color: rgba(0, 0, 0, 0.0);
    border-color: #ffffff;
    border-radius: var(--slider-height);
}
.range-slider > input[type="range"]:focus + .slider {
    background-color: rgba(0, 0, 0, 0.0);
    outline-color: #06f;
}

.range-slider > .slider > .thumb::before {
    background: linear-gradient(#ccc, #888);
    border-color: #333;
    border-radius: var(--slider-height);
}

<script>


const updateSlider = (range) => {
	
    const slider = range.nextElementSibling;
    const thumb = slider.firstElementChild;

    const distance = (range.value / range.max);
    const offset = (thumb.offsetWidth / slider.offsetWidth) * distance;
    const position = Math.floor((distance - offset) * 100);

    thumb.style.insetInlineStart = position + '%';

    if(typeof(thumb.style.insetInlineStart) == 'undefined') {
        thumb.style.left = position + '%';
    }
}

for(const type of ['input','change']) {
    document.addEventListener(type, (e) => {
        if(e.target.closest('.range-slider')) {
            updateSlider(e.target);
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const ranges = document.querySelectorAll('.range-slider > input[type="range"]');
    for(const range of ranges) {
        updateSlider(range);
    }
});

function showModal(_width,_height,_title,_content) {
  const modal = document.getElementById('cyberModal1');
  const dragHeader = modal.querySelector('.modal-header');
  const closeIcon = dragHeader.querySelector('.close-icon');
  const minimizeIcon = dragHeader.querySelector('.minimize-icon');
  const content=modal.querySelector('.modal-content');
  let offsetX, offsetY;
  let isDragging = false;
  
  modal.style.width=_width;
  modal.style.height=_height;
  modal.style.zIndex="9999999999999";
  document.getElementById("modal-htext").innerHTML=_title;
  content.innerHTML=_content;
	
  closeIcon.addEventListener("click",()=>{
	modal.style.display = 'none';
  });
 

  let prevWidth = modal.style.width;
  let prevHeight = modal.style.height;
  minimizeIcon.addEventListener('click', toggleMinimize);

  function toggleMinimize() {
    if (modal.style.width === '240px' && modal.style.height === '45px') {
      modal.style.width = prevWidth;
      modal.style.height = prevHeight; 
    } else {
      prevWidth = modal.style.width;
      prevHeight = modal.style.height;
      modal.style.width = '240px';
      modal.style.height = '45px';
    }
  }
}
