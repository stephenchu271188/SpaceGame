<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>CodePen - Game UI</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.4.8/css/ionicons.min.css'>
<link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Orbitron|Questrial'>
<style>
@charset "UTF-8";
html {
  padding: 0;
  width: 100%;
  height: 100%;
  
  font-family: "Orbitron", "Ionicons", sans-serif;
  color: #ffffff;
  cursor: default;
  font-size: 2rem;
  user-select: none;
  overflow: hidden;
}

body{
  width: 100%;
  height: 100%;
  
  background: linear-gradient(60deg, #080826 25%, #0F0E35 100%);
  background-image: url("resources/bg/planets/1.jpg");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  
  transform:scale(0.9);
  cursor:url("./resources/cursor/3.png"), auto;
}

.debug {
  position: fixed;
  top: 0;
  left: 0;
  width: 50vw;
  height: 100vh;
}

.page {
  position: absolute;
  top:60px;
  left: 300px;
  width: 900px;
  height: 690px;
  animation: scaleIn 0.5s;
  transition: 0.25s;
  background-color: rgba(0, 0, 0, 0.7);
  border-radius: 15px;
  border:#f0f4f6 solid 1px;
  box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.7); 
  transition: box-shadow 0.3s ease-in-out; 
  //transform-origin:0px 0px;
}

.page.home.active {
  filter: blur(3px);
  pointer-events: none;
  //transform-origin: 0px 0px;
  //transform: perspective(1000px) rotateY(35deg) translateX(-20vw);
  
}


.list {
  position: absolute;
  top: 100px;
  left: 300px;
  width: 350px;
  height: 270px;
  
}
.list .icon {
  position: absolute;
  top: 0;
  left: -350px;
  width: 350px;
  height: 270px;
  line-height: 270px;
  text-align: center;
  font-size: 6.5em;
  color: #CDCCFF;
  text-shadow: 5px 5px 100px #4C4C99;
}
.list .icon:before {
  content: "";
}
.list .icon.s:before {
  content: "";
}
.list .icon.l:before {
  content: "";
}
.list .icon.l:after {
  content: "";
  margin-left: -0.2em;
  font-size: 0.65em;
}
.list .icon.o:before {
  content: "";
}
.list .selector {
  position: absolute;
  width: 350px;
  height: 90px;
  border-radius: 15px;
  box-shadow: inset 0 0 0 1px #46467F;
  animation: bolder 1.5s ease-in-out infinite;
  pointer-events: none;
  transition: 0.15s;
  visibility:hidden;
}
.list .item {
  position: relative;
  width: 350px;
  height: 90px;
  text-indent: 25px;
  line-height: 90px;
  box-shadow: inset 0 0 0 2px transparent;
  cursor: pointer;
  //overflow: hidden;
  transition: 0.15s;
  
}
.list .item .sub {
  position: absolute;
  font-size: 50%;
  line-height: 0px;
  transform: translateY(-40px);
  opacity: 0;
  font-weight: bolder;
  transition: 0.15s;
}
.list .item:before {
  content: "";
  position: absolute;
  right: 30px;
  line-height: 90px;
  font-family: "Ionicons";
  color: #4C4C99;
  text-shadow: 0 0 30px #4C4C99;
  transform-origin: left center;
  transform: scale(0.9);
  opacity: 0;
  transition: 0.15s;
}
.list .item.active {
  line-height: 65px;
  color: #CDCCFF;
  
  text-shadow:
        0 0 5px #0ff,
        0 0 10px #0ff,
        0 0 20px #0ff,
        0 0 40px #0ff,
        0 0 80px #0ff;
}
.list .item.active .sub {
  transform: translateY(0px);
  opacity: 1;
  color: #4C4C99;
  text-shadow: none;
}
.list .item.active:before {
  transform: scale(1);
  right: 25px;
  opacity: 1;
}

@keyframes scaleIn {
  0% {
    transform: scale(1.3);
    filter: blur(20px);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    filter: blur(0px);
    opacity: 1;
  }
}
@keyframes bolder {
  0%, 100% {
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px #46467F;
  }
  50% {
    border-radius: 15px;
    box-shadow: inset 0 0 0 2px #4C4C99;
    background: rgba(255, 255, 255, 0.015);
  }
}

.ag-format-container {
  width: 1142px;
  margin: 0 auto;
}

.ag-meteor-block {
  height: 100%;
  width: 100%;
  background-position: 100% 0;
  background-size: cover;

  pointer-events: none;

  overflow: hidden;

  top: 0;
  left: 0;
}
.ag-meteor-block,
.meteor__item {
  position: absolute;
}
.meteor__item-img {
  width: 600px;
  height: 600px;
  background-image: url(https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/meteors-right/images/meteors-sprite.png);
  background-size: auto 100%;

  -webkit-animation: an-frame-animation 3s steps(48) infinite;
  -moz-animation: an-frame-animation 3s steps(48) infinite;
  -o-animation: an-frame-animation 3s steps(48) infinite;
  animation: an-frame-animation 3s steps(48) infinite;

  -webkit-transform: rotate(45deg);
  -moz-transform: rotate(45deg);
  -o-transform: rotate(45deg);
  transform: rotate(45deg);
}

@-webkit-keyframes an-frame-animation {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: -28800px 0;
  }
}

@-moz-keyframes an-frame-animation {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: -28800px 0;
  }
}

@-o-keyframes an-frame-animation {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: -28800px 0;
  }
}

@keyframes an-frame-animation {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: -28800px 0;
  }
}


@media only screen and (max-width: 767px) {
  .ag-format-container {
    width: 96%;
  }

}

@media only screen and (max-width: 639px) {

}

@media only screen and (max-width: 479px) {

}

@media (min-width: 768px) and (max-width: 979px) {
  .ag-format-container {
    width: 750px;
  }

}

@media (min-width: 980px) and (max-width: 1161px) {
  .ag-format-container {
    width: 960px;
  }

}

.alert-message {line-height:20px; font-size:15px;padding-bottom: 12px;}
h1{color:#e35154 !important; font-size:18px; margin-left:20px; margin-bottom:20px;font-weight:700; text-transform: uppercase;}

body a, body #test {
  color: #fff;
}

.unstyled {
  margin: 0;
  list-style: none;
}
.unstyled a, .unstyled #test {
  width: 120px;
  text-decoration: none;
  padding: .5em 1em;
  background-color: #213347;
  border-radius: 4px;
  display: block;
  margin-bottom: .5em;
  font-size:15px;
  font-weight:300;
  font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.unstyled a:hover, .unstyled #test:hover {
  background-color: #f25c5d;
}

.cf, .alert {
  *zoom: 1;
}
.cf:before, .alert:before, .cf:after, .alert:after {
  display: table; 
  content: "";
  line-height: 0;
}
.cf:after, .alert:after {
  clear: both;
}

#alerts {
  width: 400px;
  top: 12px;
  right: 40%;
  position: fixed;
  z-index: 9999;
  list-style: none;
}

.alert {
  width: 100%;
  margin-bottom: 8px;
  display: block;
  position: relative;
  border-left: 4px solid;
  right: -50px;
  opacity: 0;
  line-height: 1;
  padding: 0;
  transition: right 400ms, opacity 400ms, line-height 300ms 100ms, padding 300ms 100ms;
  display: table;
}

.alert:hover {
  cursor: pointer;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
}

.open {
  right: 0;
  opacity: 1;
  line-height: 2;
  padding: 3px 15px;
  transition: line-height 200ms, padding 200ms, right 350ms 200ms, opacity 350ms 200ms;
}

.alert-title {
  font-weight: bold;
}

.alert-block {
  width: 80%;
  width: -webkit-calc(100% - 10px);
  width: calc(100% - 10px);
  text-align: left;
}
.alert-block em, .alert-block small {
  font-size: .75em;
  opacity: .75;
  display: block;
}

.alert i {
  font-size: 2em;
  width: 1.5em;
  max-height: 48px;
  top: 50%;
  margin-top: -12px;
  display: table-cell;
  vertical-align: middle;
}

.alert-success {
  color: #fff;
  border-color: #539753;
  background-color: #8fbf2f;
}

.alert-error {
  color: #fff;
  border-color: #dc4a4d;
  background-color: #f25c5d;
}

.alert-trash {
  color: #fff;
  border-color: #dc4a4d;
  background-color: #f25c5d;
}

.alert-info {
  color: #fff;
  border-color: #076d91;
  background-color: #3397db;
}

.alert-warning {
  color: #fff;
  border-color: #dd6137;
  background-color: #f7931d;
}

.status-icon{
	width:50px;
	position:absolute;
	left:-60px;
	top:10px;
	filter:brightness( 190% );
}
.loader {
  width: 120px;
  height: 22px;
  color: turquoise;
  border: 2px solid white;
  position: relative;
  margin-left:350px;
  margin-top:-56px;
  transform:skewX(-20deg);
}
.loader::before {
  content: "";
  position: absolute;
  margin: 2px;
  inset: 0 calc(100% - var(--progress, 0%)) 0 0;
  border-radius: inherit;
  background: currentColor;
  transition: inset 0.4s ease; /* cho mượt */
}
@keyframes l6 {
    100% {inset:0}
}
</style>
